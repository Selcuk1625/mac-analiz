name: Veri güncelle

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verileri çek
        env:
          FD_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
        run: |
          mkdir -p data
          for code in PL BL1 SA PD FL1 DED CL; do
            for kind in standings matches; do
              curl -sS -f -H "X-Auth-Token: $FD_TOKEN" "https://api.football-data.org/v4/competitions/$code/$kind" -o "data/$code-$kind.json" || echo "hata: $code $kind"
              sleep 7
            done
          done
          date -u +%Y-%m-%dT%H:%M:%SZ > data/guncelleme.txt

      - name: Kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add data
          git commit -m "Veri güncellendi" || echo "değişiklik yok"
          git push

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maç Analiz</title>
<style>
:root{--bg:#F5F6F3;--card:#fff;--fg:#16211B;--mute:#5E6B63;--line:#DCE1DB;--acc:#1D6B49;--accfg:#fff;--g:#1F7A4D;--d:#A08B2E;--l:#B3433B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1411;--card:#161E19;--fg:#E8EEE9;--mute:#93A196;--line:#26332B;--acc:#4FB988;--accfg:#06150D;--g:#4FB988;--d:#D2BD5A;--l:#E0716A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin-inline:auto}
h1{font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
h3{font-size:.95rem;margin:16px 0 6px}
.sub,.hint,.meta,.note{color:var(--mute);font-size:.82rem;margin:0 0 12px}
label{display:block;font-size:.85rem;margin-bottom:6px}
input,select,button{font:inherit;color:inherit}
select{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer}
.bar{margin-bottom:10px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{flex:1;background:none;color:var(--mute);border-radius:0;border-bottom:2px solid transparent;padding:10px 4px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.msg{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;color:var(--mute);font-weight:600}
td.tn,th.tn{text-align:left}
tbody tr{cursor:pointer}
.crest{width:18px;height:18px;vertical-align:-4px;margin-right:6px;object-fit:contain}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tile b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.72rem;color:var(--mute)}
.form{display:flex;gap:4px}
.chip{width:24px;height:24px;border-radius:6px;color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.chip.G{background:var(--g)}.chip.B{background:var(--d)}.chip.M{background:var(--l)}
.hd{display:flex;align-items:center;gap:10px;margin:8px 0}
.hd img{width:40px;height:40px;object-fit:contain}
.hd b{font-size:1.15rem}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.cmp{margin:12px 0}
.cmp .t{font-size:.8rem;color:var(--mute);text-align:center;margin-bottom:4px}
.cmp .r{display:grid;grid-template-columns:3.2em 1fr 1fr 3.2em;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .r b{font-size:.95rem}
.cmp .r b:first-child{text-align:right}
.bl,.br{height:8px;background:var(--line);border-radius:4px;display:flex}
.bl{justify-content:flex-end}
.bl i,.br i{display:block;height:100%;border-radius:4px;background:var(--mute)}
.bl i.win,.br i.win{background:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Maç Analiz</h1>
<p class="sub">Takım istatistikleri. Sonuç tahmini yapmaz.</p>

<div id="app">
  <div class="bar"><select id="league" aria-label="Lig"></select></div>
  <nav class="tabs">
    <button data-tab="table" class="on">Puan durumu</button>
    <button data-tab="team">Takım</button>
    <button data-tab="cmp">Karşılaştır</button>
  </nav>
  <div id="msg" class="msg" hidden></div>
  <section id="v-table"></section>
  <section id="v-team" hidden></section>
  <section id="v-cmp" hidden></section>
</div>

<script>
(()=>{
const LEAGUES=[['PL','Premier Lig'],['BL1','Bundesliga'],['SA','Serie A'],['PD','La Liga'],['FL1','Ligue 1'],['DED','Hollanda Eredivisie'],['CL','Şampiyonlar Ligi']];
const RAW='https://raw.githubusercontent.com/Selcuk1625/mac-analiz/main/';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const S={code:ls.get('mac_league')||'PL',data:null,tab:'table',team:null,a:null,b:null};
const f2=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const fd=d=>new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});

function msg(t){const m=$('#msg');m.hidden=!t;m.textContent=t||''}

async function getText(name){
  const q='?t='+Math.floor(Date.now()/60000);
  for(const base of ['',RAW]){
    try{const r=await fetch(base+'data/'+name+q,{cache:'no-cache'});if(r.ok)return await r.text()}catch(e){}
  }
  return null;
}
async function getJson(name){
  const t=await getText(name);
  if(t){try{return JSON.parse(t)}catch(e){}}
  throw new Error("Bu ligin verisi henüz hazır değil. GitHub'da Actions sekmesinden 'Veri güncelle' işini bir kez çalıştır.");
}

async function loadLeague(code){
  const [st,mt,up]=await Promise.all([getJson(code+'-standings.json'),getJson(code+'-matches.json'),getText('guncelleme.txt')]);
  const info={};
  const groups=(st.standings||[]).filter(s=>s.type==='TOTAL').map(s=>({group:s.group,rows:s.table.map(r=>{
    info[r.team.id]={n:r.team.shortName||r.team.name,c:r.team.crest};
    return{p:r.position,id:r.team.id,pg:r.playedGames,w:r.won,d:r.draw,l:r.lost,pts:r.points,gf:r.goalsFor,ga:r.goalsAgainst,gd:r.goalDifference};
  })}));
  const m=(mt.matches||[]).map(x=>{
    [x.homeTeam,x.awayTeam].forEach(t=>{if(t&&t.id&&!info[t.id])info[t.id]={n:t.shortName||t.name,c:t.crest}});
    return{d:x.utcDate,s:x.status,h:x.homeTeam&&x.homeTeam.id,a:x.awayTeam&&x.awayTeam.id,hg:x.score&&x.score.fullTime?x.score.fullTime.home:null,ag:x.score&&x.score.fullTime?x.score.fullTime.away:null};
  });
  const se=st.season||{};
  const season=se.startDate?se.startDate.slice(0,4)+'/'+(se.endDate||'').slice(2,4):'';
  let upd='';
  if(up){const dt=new Date(up.trim());if(!isNaN(dt))upd=dt.toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
  return{groups,m,info,season,md:se.currentMatchday,upd};
}

const ids=()=>S.data?S.data.groups.flatMap(g=>g.rows.map(r=>r.id)):[];
const nm=id=>(S.data.info[id]||{}).n||'?';
const crest=id=>{const c=(S.data.info[id]||{}).c;return c?'<img class="crest" src="'+esc(c)+'" alt="" onerror="this.remove()">':''};
const rowOf=id=>{for(const g of S.data.groups){const r=g.rows.find(x=>x.id===id);if(r)return r}return null};

function agg(a){
  const n=a.length;let pts=0,gf=0,ga=0,cs=0;
  a.forEach(x=>{pts+=x.r==='G'?3:x.r==='B'?1:0;gf+=x.gf;ga+=x.ga;if(x.ga===0)cs++});
  return{n,pts,gf,ga,cs,ppg:n?pts/n:0,gfa:n?gf/n:0,gaa:n?ga/n:0,csr:n?cs/n:0};
}
function stats(id){
  const rec=S.data.m.filter(m=>m.s==='FINISHED'&&m.hg!=null&&(m.h===id||m.a===id)).sort((x,y)=>x.d<y.d?-1:1).map(m=>{
    const home=m.h===id,gf=home?m.hg:m.ag,ga=home?m.ag:m.hg;
    return{d:m.d,home,opp:home?m.a:m.h,gf,ga,r:gf>ga?'G':gf<ga?'M':'B'};
  });
  let un=0;for(let i=rec.length-1;i>=0&&rec[i].r!=='M';i--)un++;
  const nx=S.data.m.filter(m=>['SCHEDULED','TIMED','IN_PLAY','PAUSED'].includes(m.s)&&(m.h===id||m.a===id)).sort((x,y)=>x.d<y.d?-1:1)[0];
  return{all:agg(rec),home:agg(rec.filter(x=>x.home)),away:agg(rec.filter(x=>!x.home)),last5:agg(rec.slice(-5)),recent:rec.slice(-5).reverse(),un,nx};
}
const chips=a=>'<div class="form">'+a.slice().reverse().map(x=>'<span class="chip '+x.r+'">'+x.r+'</span>').join('')+'</div>';
const teamSel=(idn,cur)=>'<select id="'+idn+'">'+ids().map(i=>'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+esc(nm(i))+'</option>').join('')+'</select>';

function rTable(){
  const el=$('#v-table'),d=S.data;
  if(!d){el.innerHTML='';return}
  el.innerHTML='<p class="meta">Sezon '+esc(d.season)+(d.md?' · '+d.md+'. hafta':'')+(d.upd?' · Veri: '+esc(d.upd):'')+'</p>'+d.groups.map(g=>
    (g.group?'<h3>'+esc(String(g.group).replace(/_/g,' '))+'</h3>':'')+
    '<div class="scroll"><table><thead><tr><th>#</th><th class="tn">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Gol</th><th>Av</th><th>P</th></tr></thead><tbody>'+
    g.rows.map(r=>'<tr data-id="'+r.id+'"><td>'+r.p+'</td><td class="tn">'+crest(r.id)+esc(nm(r.id))+'</td><td>'+r.pg+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+':'+r.ga+'</td><td>'+(r.gd>0?'+':'')+r.gd+'</td><td><b>'+r.pts+'</b></td></tr>').join('')+
    '</tbody></table></div>').join('');
  el.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{S.team=+tr.dataset.id;tab('team')});
}

function rTeam(){
  const el=$('#v-team'),d=S.data;
  if(!d){el.innerHTML='';return}
  const id=S.team,s=stats(id),r=rowOf(id);
  const sp=(l,x)=>'<tr><td class="tn">'+l+'</td><td>'+x.n+'</td><td>'+(x.n?f2(x.ppg):'–')+'</td><td>'+x.gf+':'+x.ga+'</td></tr>';
  el.innerHTML=teamSel('selTeam',id)+
  '<div class="hd">'+(crest(id)?crest(id).replace('class="crest"',''):'')+'<div><b>'+esc(nm(id))+'</b><div class="meta" style="margin:0">'+(r?r.p+'. sıra · '+r.pts+' puan':'')+'</div></div></div>'+
  '<div class="tiles"><div class="tile"><b>'+(s.all.n?f2(s.all.ppg):'–')+'</b><span>Puan / maç</span></div>'+
  '<div class="tile"><b>'+(s.all.n?f2(s.all.gfa):'–')+'</b><span>Atılan gol / maç</span></div>'+
  '<div class="tile"><b>'+(s.all.n?f2(s.all.gaa):'–')+'</b><span>Yenilen gol / maç</span></div>'+
  '<div class="tile"><b>'+s.all.cs+'</b><span>Gol yemeden biten maç</span></div>'+
  '<div class="tile"><b>'+s.un+'</b><span>Yenilmezlik serisi</span></div>'+
  '<div class="tile"><b>'+(r?(r.gd>0?'+':'')+r.gd:'–')+'</b><span>Averaj</span></div></div>'+
  '<h3>Son 5 maç</h3>'+(s.recent.length?chips(s.recent)+'<ul class="list" style="margin-top:8px">'+s.recent.map(x=>'<li><span>'+fd(x.d)+' · '+(x.home?'İç saha':'Deplasman')+' · '+esc(nm(x.opp))+'</span><b>'+x.gf+'-'+x.ga+'</b></li>').join('')+'</ul>':'<p class="meta">Henüz oynanmış maç yok.</p>')+
  '<h3>İç saha / deplasman</h3><div class="scroll"><table><thead><tr><th class="tn"></th><th>O</th><th>P/maç</th><th>Gol</th></tr></thead><tbody>'+sp('Genel',s.all)+sp('İç saha',s.home)+sp('Deplasman',s.away)+'</tbody></table></div>'+
  '<h3>Sıradaki maç</h3>'+(s.nx?'<p style="margin:0">'+fd(s.nx.d)+' · '+esc(nm(s.nx.h===id?s.nx.a:s.nx.h))+' ('+(s.nx.h===id?'iç saha':'deplasman')+')</p>':'<p class="meta">Planlı maç görünmüyor.</p>');
  $('#selTeam').onchange=e=>{S.team=+e.target.value;rTeam()};
}

function rCmp(){
  const el=$('#v-cmp'),d=S.data;
  if(!d){el.innerHTML='';return}
  const A=stats(S.a),B=stats(S.b);
  const rows=[
    ['Sezon puan / maç',A.all.ppg,B.all.ppg,1,A.all.n&&B.all.n],
    ['İç saha (sol) / deplasman (sağ) puan / maç',A.home.ppg,B.away.ppg,1,A.home.n&&B.away.n],
    ['Atılan gol / maç',A.all.gfa,B.all.gfa,1,A.all.n&&B.all.n],
    ['Yenilen gol / maç (az olan iyi)',A.all.gaa,B.all.gaa,-1,A.all.n&&B.all.n],
    ['Son 5 maçta puan (15 üzerinden)',A.last5.pts,B.last5.pts,1,A.last5.n&&B.last5.n],
    ['Gol yemeden bitirdiği maç oranı',A.all.csr*100,B.all.csr*100,1,A.all.n&&B.all.n]
  ];
  const fm=(v,i)=>i===4?String(v):i===5?Math.round(v)+'%':f2(v);
  const h2h=d.m.filter(m=>m.s==='FINISHED'&&m.hg!=null&&((m.h===S.a&&m.a===S.b)||(m.h===S.b&&m.a===S.a))).sort((x,y)=>x.d<y.d?1:-1);
  el.innerHTML='<div class="two"><div><label for="selA">Ev sahibi</label>'+teamSel('selA',S.a)+'</div><div><label for="selB">Deplasman</label>'+teamSel('selB',S.b)+'</div></div>'+
  '<div class="cmp">'+rows.map((r,i)=>{
    if(!r[4])return'<div class="t">'+r[0]+'</div><div class="r"><b>–</b><div class="bl"></div><div class="br"></div><b>–</b></div>';
    const mx=Math.max(r[1],r[2],0.0001),wa=r[3]>0?r[1]>r[2]:r[1]<r[2],wb=r[3]>0?r[2]>r[1]:r[2]<r[1];
    return'<div class="t" style="margin-top:12px">'+r[0]+'</div><div class="r"><b>'+fm(r[1],i)+'</b><div class="bl"><i class="'+(wa?'win':'')+'" style="width:'+(r[1]/mx*100)+'%"></i></div><div class="br"><i class="'+(wb?'win':'')+'" style="width:'+(r[2]/mx*100)+'%"></i></div><b>'+fm(r[2],i)+'</b></div>';
  }).join('')+'</div>'+
  '<h3>Bu sezon aralarındaki maçlar</h3>'+(h2h.length?'<ul class="list">'+h2h.map(m=>'<li><span>'+fd(m.d)+' · '+esc(nm(m.h))+' - '+esc(nm(m.a))+'</span><b>'+m.hg+'-'+m.ag+'</b></li>').join('')+'</ul>':'<p class="meta">Bu sezon henüz oynanmış bir maçları yok.</p>')+
  '<p class="note" style="margin-top:14px">Bu sayfa geçmiş sonuçların özetidir, maç sonucunu tahmin etmez.</p>';
  $('#selA').onchange=e=>{S.a=+e.target.value;rCmp()};
  $('#selB').onchange=e=>{S.b=+e.target.value;rCmp()};
}

function tab(t){
  S.tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['table','team','cmp'].forEach(x=>$('#v-'+x).hidden=x!==t);
  if(t==='team')rTeam();
  if(t==='cmp')rCmp();
}

async function go(){
  msg('Yükleniyor…');
  S.data=null;
  try{S.data=await loadLeague(S.code);msg('')}
  catch(e){msg(e.message);rTable();tab(S.tab);return}
  const l=ids();
  if(!l.includes(S.team))S.team=l[0];
  if(!l.includes(S.a))S.a=l[0];
  if(!l.includes(S.b))S.b=l[1]||l[0];
  rTable();tab(S.tab);
}

$('#league').innerHTML=LEAGUES.map(l=>'<option value="'+l[0]+'"'+(l[0]===S.code?' selected':'')+'>'+l[1]+'</option>').join('');
$('#league').onchange=e=>{S.code=e.target.value;ls.set('mac_league',S.code);go()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
go();
})();
</script>
</body>
</html>
